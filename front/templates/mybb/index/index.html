<html>
<head>
<title>{$mybb->settings['bbname']}</title>
{$headerinclude}
</head>
<body>
{$header}

<div class="hxh-foro-shell hxh-index-shell">
    <div class="hxh-tablon-wrapper">
        <div class="hxh-index-banner" id="hxh-index-banner">
            <div class="hxh-index-banner-overlay"></div>
        </div>

        <div class="hxh-grid-tablon rpg-tablon-container" data-bburl="{$mybb->settings['bburl']}">
            <div class="hxh-tablon-box hxh-tablon-box--tiempo">
                <h3 class="hxh-tablon-box-header"><i class="fas fa-calendar-alt" aria-hidden="true"></i> Día</h3>
                <div class="hxh-tablon-box-body">
                    <div id="tablon-fecha-widget" class="rpg-tablon-fecha-widget hxh-tablon-fecha" data-href="{$mybb->settings['bburl']}/game/public/calendario.php">
                        <div id="tablon-fecha-container" class="rpg-tablon-fecha-container rpg-tablon-fecha-container--{$rol_season_key}">
                            <div class="rpg-tablon-fecha-dia-number" id="tablon-fecha-num">{$rol_day}</div>
                            <div class="rpg-tablon-fecha-meta">
                                <span id="tablon-fecha-estacion">{$rol_season_name}</span>
                                <span id="tablon-fecha-anio">Año {$rol_year}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hxh-tablon-box hxh-tablon-box--anuncios">
                <h3 class="hxh-tablon-box-header"><i class="fas fa-bullhorn" aria-hidden="true"></i> Anuncios</h3>
                <div class="hxh-tablon-box-body">
                    <div id="tablon-anuncios-v2" class="rpg-tablon-scroll rpg-tablon-scroll--anuncios">
                        <div class="rpg-tablon-shimmer-wrap">
                            <div class="rpg-tablon-shimmer-row"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hxh-tablon-box hxh-tablon-box--busquedas">
                <h3 class="hxh-tablon-box-header"><i class="fas fa-search" aria-hidden="true"></i> Búsquedas</h3>
                <div class="hxh-tablon-box-body">
                    <div id="tablon-busquedas-list" class="rpg-tablon-scroll rpg-tablon-scroll--busquedas">
                        <div class="rpg-tablon-shimmer-wrap">
                            <div class="rpg-tablon-shimmer-row"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hxh-tablon-box hxh-tablon-box--staff">
                <h3 class="hxh-tablon-box-header"><i class="fas fa-id-badge" aria-hidden="true"></i> Staff</h3>
                <div class="hxh-tablon-box-body">
                    <div id="tablon-staff-v2" class="hxh-tablon-staff-row">
                        <div class="rpg-tablon-shimmer-wrap">
                            <div class="rpg-tablon-shimmer-row rpg-tablon-shimmer-row--lg"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hxh-tablon-box hxh-tablon-box--temas">
                <h3 class="hxh-tablon-box-header"><i class="fas fa-comments" aria-hidden="true"></i> Últimos Temas</h3>
                <div class="hxh-tablon-box-body hxh-tablon-box-body--stack">
                    <div id="tablon-temas-v2" class="rpg-tablon-scroll rpg-tablon-scroll--temas">
                        <div class="rpg-tablon-shimmer-wrap">
                            <div class="rpg-tablon-shimmer-row"></div>
                        </div>
                    </div>
                    <div class="hxh-tablon-box-footer">
                        <a href="#" target="_blank" rel="noopener" class="rpg-tablon-discord"><i class="fab fa-discord"></i> Discord del foro</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="hxh-index-worlds">
        {$forums}
    </div>

    <div class="hxh-index-stats">
        {$boardstats}
    </div>
</div>

<div id="busqueda-detalle-modal" class="rpg-busqueda-modal">
    <div class="rpg-busqueda-modal__panel">
        <button type="button" class="rpg-busqueda-modal__close" id="bdm-close-btn"><i class="fas fa-times"></i></button>
        <div id="bdm-img-wrap" class="rpg-busqueda-modal__hero">
            <img id="bdm-img" src="" alt="" />
            <div class="rpg-busqueda-modal__hero-fade"></div>
        </div>
        <div class="rpg-busqueda-modal__body">
            <div class="rpg-busqueda-modal__author">
                <img id="bdm-avatar" src="" alt="" class="rpg-busqueda-modal__avatar" />
                <div>
                    <div id="bdm-pj" class="rpg-busqueda-modal__pj"></div>
                    <div id="bdm-date" class="rpg-busqueda-modal__date"></div>
                </div>
            </div>
            <h2 id="bdm-titulo" class="rpg-busqueda-modal__title"></h2>
            <div id="bdm-desc" class="rpg-busqueda-modal__desc"></div>
            <button type="button" id="bdm-contact-btn" class="rpg-btn--primary is-hidden">
                <i class="fas fa-paper-plane"></i> Contactar por Trama
            </button>
        </div>
    </div>
</div>

{$footer}

<script type="text/javascript" src="{$mybb->settings['bburl']}/jscripts/game/index_tablon.js?v=5"></script>
<script type="text/javascript" src="{$mybb->settings['bburl']}/jscripts/game/index_mosaic.js?v=2"></script>
<div class="scroll-top"><i class="fas fa-chevron-up"></i></div>
</body>
</html>
