<div class="rpg-thread-header" style="background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1.25rem;box-shadow:var(--shadow-card);">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;">

    <!-- Left: breadcrumb + title -->
    <div style="flex:1;min-width:0;">
      <!-- Breadcrumb -->
      <nav style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.4rem;display:flex;align-items:center;flex-wrap:wrap;gap:0.2rem;">
        {$nav}
      </nav>
      <!-- Thread title -->
      <h2 style="margin:0;font-family:var(--font-heading);font-size:1.25rem;font-weight:800;color:var(--text-primary);line-height:1.3;word-break:break-word;">
        <i class="fas fa-scroll" style="color:var(--accent-indigo);margin-right:0.45rem;font-size:1rem;"></i>
        {$thread['subject']}
      </h2>
    </div>

    <!-- Right: action buttons -->
    <div style="display:flex;align-items:center;gap:0.6rem;flex-shrink:0;flex-wrap:wrap;">
      {$newreply}
      {$newthread}
    </div>

  </div>

  <!-- Separator -->
  <div style="height:1px;background:linear-gradient(90deg,var(--accent-indigo) 0%,var(--accent-purple) 50%,transparent 100%);margin-top:1rem;border-radius:1px;opacity:0.45;"></div>
</div>
