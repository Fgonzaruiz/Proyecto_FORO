<div class="rpg-post-author-stats" style="width:100%;display:flex;flex-direction:column;gap:0.35rem;margin-top:0.4rem;">

  <div style="font-size:0.72rem;color:var(--text-muted);display:flex;align-items:center;gap:0.45rem;">
    <i class="fas fa-comment" style="color:var(--accent-indigo);width:13px;text-align:center;flex-shrink:0;"></i>
    <span>Posts: <strong style="color:var(--text-secondary);">{$post['userpostcount']}</strong></span>
  </div>

  <div style="font-size:0.72rem;color:var(--text-muted);display:flex;align-items:center;gap:0.45rem;">
    <i class="fas fa-list" style="color:var(--accent-purple);width:13px;text-align:center;flex-shrink:0;"></i>
    <span>Hilos: <strong style="color:var(--text-secondary);">{$post['userthreadcount']}</strong></span>
  </div>

  <div style="font-size:0.72rem;color:var(--text-muted);display:flex;align-items:center;gap:0.45rem;">
    <i class="fas fa-calendar-alt" style="color:var(--accent-blue);width:13px;text-align:center;flex-shrink:0;"></i>
    <span>Se unió: <strong style="color:var(--text-secondary);">{$post['userregdate']}</strong></span>
  </div>

  <div style="font-size:0.72rem;color:var(--text-muted);display:flex;align-items:center;gap:0.45rem;">
    <i class="fas fa-star" style="color:var(--accent-orange);width:13px;text-align:center;flex-shrink:0;"></i>
    <span>Reputación: <strong style="color:var(--text-secondary);">{$post['reputation']}</strong></span>
  </div>

</div>
