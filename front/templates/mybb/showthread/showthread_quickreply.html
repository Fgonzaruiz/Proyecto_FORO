<div class="rpg-quickreply-container hxh-posting-shell">

  <div class="hxh-license-header hxh-posting-header">
    <div class="hxh-license-header__brand">
      <span class="hxh-license-header__xx" aria-hidden="true">✕</span>
      <div class="hxh-license-header__titles">
        <span class="hxh-license-stamp">REGISTRO DE ACCIÓN · RESPUESTA RÁPIDA</span>
        <h2 class="hxh-license-name"><i class="fas fa-reply"></i> Respuesta Rápida</h2>
      </div>
    </div>
  </div>

  <div class="rpg-quickreply-body hxh-posting-compose">

    <div class="rpg-quickreply-avatar">
      <div class="rpg-quickreply-avatar__circle">
        <i class="fas fa-user"></i>
      </div>
      <span class="rpg-quickreply-avatar__label">Tu respuesta</span>
    </div>

    <div class="rpg-quickreply-form">

      <form action="newreply.php" method="post" enctype="multipart/form-data" id="quick_reply_form" class="rpg-quickreply-form-inner">

        <input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
        <input type="hidden" name="action" value="do_newreply" />
        <input type="hidden" name="tid" value="{$tid}" />
        <input type="hidden" name="from_page" value="1" />
        <input type="hidden" name="posthash" value="{$posthash}" />
        <input type="hidden" name="quoted_ids" value="" />
        <input type="hidden" name="lastpid" value="{$lastpid}" />

        {$preview}

        <textarea
          id="message"
          name="message"
          class="rpg-editor-textarea"
          rows="6"
          placeholder="Escribe tu respuesta aquí..."
        ></textarea>

        {$posting_rpg_system_block}

        <div class="rpg-quickreply-footer">
          <span class="rpg-quickreply-hint">
            <i class="fas fa-info-circle"></i>
            Para una respuesta completa usa el editor avanzado.
          </span>
          <div class="rpg-quickreply-actions">
            <a href="newreply.php?tid={$tid}" class="rpg-btn--ghost">
              <i class="fas fa-expand-alt"></i> Editor completo
            </a>
            <button type="submit" name="submit" id="quick_reply_submit" class="rpg-btn--primary">
              <i class="fas fa-paper-plane"></i> Publicar Respuesta
            </button>
          </div>
        </div>

      </form>

    </div>
  </div>
</div>
