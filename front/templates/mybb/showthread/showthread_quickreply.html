<div class="rpg-quickreply-container" style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);margin-top:1.5rem;overflow:hidden;box-shadow:var(--shadow-card);">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:0.6rem;padding:0.75rem 1.25rem;background:var(--bg-surface);border-bottom:1px solid var(--border-color);">
    <i class="fas fa-reply" style="color:var(--accent-indigo);font-size:0.9rem;"></i>
    <span style="font-family:var(--font-heading);font-size:0.92rem;font-weight:700;color:var(--text-primary);">Respuesta Rápida</span>
  </div>

  <!-- Body: avatar + form side by side -->
  <div style="display:flex;gap:0;align-items:stretch;">

    <!-- Avatar placeholder column -->
    <div class="rpg-quickreply-avatar" style="width:100px;min-width:100px;background:var(--bg-surface);border-right:1px solid var(--border-color);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.25rem 0.75rem;gap:0.5rem;flex-shrink:0;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--bg-main);border:2px solid var(--accent-indigo);display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <i class="fas fa-user" style="color:var(--text-muted);font-size:1.4rem;"></i>
      </div>
      <span style="font-size:0.68rem;color:var(--text-muted);text-align:center;line-height:1.3;">Tu respuesta</span>
    </div>

    <!-- Form column -->
    <div class="rpg-quickreply-form" style="flex:1;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:0.85rem;">

      <form action="newreply.php" method="post" enctype="multipart/form-data" id="quick_reply_form" style="display:flex;flex-direction:column;gap:0.85rem;">

        <input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
        <input type="hidden" name="action" value="do_newreply" />
        <input type="hidden" name="tid" value="{$tid}" />
        <input type="hidden" name="from_page" value="1" />
        <input type="hidden" name="posthash" value="{$posthash}" />
        <input type="hidden" name="quoted_ids" value="" />
        <input type="hidden" name="lastpid" value="{$lastpid}" />

        <!-- Textarea -->
        <textarea
          id="message"
          name="message"
          class="rpg-editor-textarea"
          rows="6"
          placeholder="Escribe tu respuesta aquí..."
          style="width:100%;box-sizing:border-box;background:var(--bg-main);border:1px solid var(--border-color);border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-body);font-size:0.9rem;line-height:1.7;padding:0.75rem 1rem;resize:vertical;outline:none;transition:border-color 0.2s;min-height:120px;"
          onfocus="this.style.borderColor='var(--accent-indigo)';"
          onblur="this.style.borderColor='var(--border-color)';"
        ></textarea>

        <!-- Card selector panel -->
        <div id="rpg-card-selector" class="rpg-card-selector" style="display:none; border-top: 1px dashed var(--border-color); padding-top: 10px; margin-top: 5px;">
          <button type="button" id="rpg-card-toggle-btn" class="rpg-action-btn rpg-btn-secondary" style="font-size: 12px; padding: 4px 10px; margin-bottom: 10px;">
            🃏 Jugar Cartas
          </button>
          <div id="rpg-card-deck-panel" class="rpg-card-deck-panel" style="display:none; gap: 10px; flex-wrap: wrap; max-height: 200px; overflow-y: auto;">
            <!-- JS populates this -->
          </div>
          <input type="hidden" name="rpg_played_cards" id="rpg_played_cards" value="" />
        </div>

        <!-- Footer toolbar -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;">

          <!-- Left: helper hint -->
          <span style="font-size:0.75rem;color:var(--text-muted);display:flex;align-items:center;gap:0.35rem;">
            <i class="fas fa-info-circle" style="color:var(--accent-indigo);"></i>
            Para una respuesta completa usa el editor avanzado.
          </span>

          <!-- Right: submit -->
          <div style="display:flex;align-items:center;gap:0.6rem;">
            <a href="newreply.php?tid={$tid}" style="font-size:0.8rem;color:var(--text-muted);text-decoration:none;padding:0.4rem 0.75rem;border:1px solid var(--border-color);border-radius:var(--radius-md);transition:border-color 0.2s;" onmouseover="this.style.borderColor='var(--accent-indigo)';" onmouseout="this.style.borderColor='var(--border-color)';">
              <i class="fas fa-expand-alt"></i> Editor completo
            </a>
            <button type="submit" name="submit" style="display:inline-flex;align-items:center;gap:0.45rem;padding:0.5rem 1.2rem;border-radius:var(--radius-md);background:var(--accent-indigo);color:#fff;font-family:var(--font-heading);font-size:0.85rem;font-weight:700;border:none;cursor:pointer;transition:opacity 0.2s,transform 0.15s;box-shadow:0 2px 8px rgba(99,102,241,0.35);" onmouseover="this.style.opacity='0.88';this.style.transform='translateY(-1px)';" onmouseout="this.style.opacity='1';this.style.transform='translateY(0)';">
              <i class="fas fa-paper-plane"></i> Publicar Respuesta
            </button>
          </div>

        </div>

      </form>

    </div>
  </div>
</div>
