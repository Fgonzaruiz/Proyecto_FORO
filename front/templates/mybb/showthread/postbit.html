<a name="pid{$post['pid']}" id="pid{$post['pid']}"></a>
<div id="post_{$post['pid']}" class="rpg-post-card" style="display:flex;gap:0;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--shadow-card);">

  <!-- ── Sidebar ── -->
  <div class="rpg-post-sidebar" style="width:160px;min-width:160px;background:var(--bg-surface);border-right:1px solid var(--border-color);display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 1rem;gap:0.6rem;flex-shrink:0;">

    <!-- Avatar -->
    <div class="rpg-post-avatar" style="position:relative;width:90px;height:90px;border-radius:50%;overflow:hidden;border:3px solid var(--accent-indigo);box-shadow:0 0 0 3px var(--bg-surface);">
      {$avatar}
    </div>

    <!-- Online indicator -->
    <div style="display:flex;align-items:center;gap:0.35rem;font-size:0.7rem;color:var(--text-muted);">
      {$post['online_status']}
    </div>

    <!-- Username -->
    <div style="text-align:center;font-family:var(--font-heading);font-size:0.95rem;font-weight:700;word-break:break-word;line-height:1.3;">
      {$post['profilelink']}
    </div>

    <!-- Group / Role -->
    <div style="font-size:0.72rem;color:var(--accent-purple);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;text-align:center;">{$post['userrole']}</div>

    <!-- Stats block -->
    <div class="rpg-post-author-stats" style="width:100%;margin-top:0.5rem;display:flex;flex-direction:column;gap:0.3rem;">
      <div style="font-size:0.72rem;color:var(--text-muted);display:flex;align-items:center;gap:0.4rem;">
        <i class="fas fa-comment" style="color:var(--accent-indigo);width:12px;text-align:center;"></i>
        <span>Posts: <strong style="color:var(--text-secondary);">{$post['userpostcount']}</strong></span>
      </div>
      <div style="font-size:0.72rem;color:var(--text-muted);display:flex;align-items:center;gap:0.4rem;">
        <i class="fas fa-calendar-alt" style="color:var(--accent-purple);width:12px;text-align:center;"></i>
        <span style="font-size:0.68rem;">Desde: <strong style="color:var(--text-secondary);">{$post['userregdate']}</strong></span>
      </div>
    </div>
  </div>

  <!-- ── Post Body ── -->
  <div class="rpg-post-body" style="flex:1;display:flex;flex-direction:column;min-width:0;">

    <!-- Post header bar -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.55rem 1rem;background:var(--bg-surface);border-bottom:1px solid var(--border-color);">
      <span style="font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:0.4rem;">
        <i class="fas fa-clock" style="color:var(--accent-indigo);font-size:0.7rem;"></i>
        {$post['postdate']} {$post['posttime']}
      </span>
      <div style="font-size:0.78rem;font-weight:600;color:var(--accent-indigo);font-family:var(--font-heading);">
        {$post['posturl']}
      </div>
    </div>

    <!-- Post content -->
    <div class="post_body" id="pid_{$post['pid']}" style="padding:1.25rem 1.25rem 1rem;color:var(--text-primary);font-family:var(--font-body);font-size:0.93rem;line-height:1.75;flex:1;word-break:break-word;">
      {$post['message']}
    </div>

    <!-- Post footer / action buttons -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1rem;border-top:1px solid var(--border-color);background:var(--bg-surface);">
      <!-- Left: Find Posts -->
      <div style="font-size:0.78rem;">
        {$post['button_find']}
      </div>
      <!-- Right: Quote button -->
      <div>
        <span class="rpg-post-btn" style="display:inline-flex;align-items:center;gap:0.35rem;padding:0.35rem 0.85rem;border-radius:var(--radius-md);background:var(--accent-indigo);color:#fff;font-size:0.78rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:opacity 0.2s;">
          {$post['button_quote']}
        </span>
      </div>
    </div>

  </div>
</div>
