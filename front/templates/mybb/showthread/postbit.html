<a name="pid{$post['pid']}" id="pid{$post['pid']}"></a>
<div id="post_{$post['pid']}" class="rpg-post-card" style="display:flex;gap:0;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--shadow-card);">

  <!-- ── Sidebar: Character Card 290x450 ── -->
  <div class="rpg-post-pjcard" data-uid="{$post['uid']}" data-post-id="{$post['pid']}" style="width:290px;min-width:290px;height:450px;background:var(--bg-surface);border-right:1px solid var(--border-color);overflow:hidden;flex-shrink:0;position:relative;">

    <!-- Avatar 290x450 -->
    <div class="rpg-post-pjcard-avatar" style="width:100%;height:100%;background-size:cover;background-position:center;background-color:var(--bg-main);">
      <img src="{$avatar}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.style.display='none'">
    </div>

    <!-- Overlay info at bottom -->
    <div style="position:absolute;bottom:0;left:0;right:0;padding:3rem 1rem 1.2rem;background:linear-gradient(180deg,transparent 0%,rgba(10,12,22,0.9) 100%);">
      <div class="rpg-post-pj-character-name" style="font-family:var(--font-heading);font-size:1rem;font-weight:700;color:#fff;word-break:break-word;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,0.5);margin-bottom:0.2rem;">
        {$post['profilelink']}
      </div>
      <div class="rpg-post-pj-character-rank" style="font-size:0.72rem;color:rgba(255,255,255,0.7);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;text-shadow:0 1px 4px rgba(0,0,0,0.4);">{$post['userrole']}</div>
      <div class="rpg-post-pj-character-crew" style="font-size:0.68rem;color:rgba(255,255,255,0.5);margin-top:0.1rem;text-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>
      <div style="display:flex;gap:0.35rem;font-size:0.7rem;color:rgba(255,255,255,0.5);margin-top:0.15rem;">
        <span>{$post['online_status']}</span>
      </div>
      <div style="margin-top:0.35rem;display:flex;gap:0.5rem;font-size:0.68rem;color:rgba(255,255,255,0.5);flex-wrap:wrap;">
        <span><i class="fas fa-comment" style="color:rgba(255,255,255,0.4);"></i> {$post['userpostcount']}</span>
        <span><i class="fas fa-calendar-alt" style="color:rgba(255,255,255,0.4);"></i> {$post['userregdate']}</span>
      </div>
    </div>
  </div>

  <!-- ── Post Body ── -->
  <div class="rpg-post-body" style="flex:1;display:flex;flex-direction:column;min-width:0;">

    <!-- Post header bar -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.55rem 1rem;background:var(--bg-surface);border-bottom:1px solid var(--border-color);">
      <span style="font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:0.4rem;">
        <i class="fas fa-clock" style="color:var(--accent-indigo);font-size:0.7rem;"></i>
        {$post['postdate']} {$post['posttime']}
      </span>
      <div style="font-size:0.78rem;font-weight:600;color:var(--accent-indigo);font-family:var(--font-heading);">
        {$post['posturl']}
      </div>
    </div>

    <!-- Post content -->
    <div class="post_body" id="pid_{$post['pid']}" style="padding:1.25rem 1.25rem 1rem;color:var(--text-primary);font-family:var(--font-body);font-size:0.93rem;line-height:1.75;flex:1;word-break:break-word;">
      {$post['message']}
    </div>

    <!-- Post footer / action buttons -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1rem;border-top:1px solid var(--border-color);background:var(--bg-surface);">
      <div style="font-size:0.78rem;">
        {$post['button_find']}
      </div>
      <div>
        <span class="rpg-modonly rpg-post-btn" style="display:inline-flex;align-items:center;gap:0.35rem;padding:0.35rem 0.85rem;border-radius:var(--radius-md);background:var(--accent-red);color:#fff;font-size:0.78rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:opacity 0.2s;">
          {$post['button_quickdelete']}
        </span>
        <span class="rpg-post-btn" style="display:inline-flex;align-items:center;gap:0.35rem;padding:0.35rem 0.85rem;border-radius:var(--radius-md);background:var(--accent-indigo);color:#fff;font-size:0.78rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:opacity 0.2s;">
          {$post['button_edit']}
        </span>
        <span class="rpg-post-btn" style="display:inline-flex;align-items:center;gap:0.35rem;padding:0.35rem 0.85rem;border-radius:var(--radius-md);background:var(--accent-indigo);color:#fff;font-size:0.78rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:opacity 0.2s;">
          {$post['button_quote']}
        </span>
      </div>
    </div>

  </div>
</div>
<!-- Cards played in this post -->
<div class="rpg-post-cards-zone" data-post-id="{$post['pid']}" style="display:none; margin-top: -0.75rem; margin-bottom: 1.25rem; padding: 1.25rem 1.5rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);"></div>
