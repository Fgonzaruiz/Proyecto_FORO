<a name="pid{$post['pid']}" id="pid{$post['pid']}"></a>
<div id="post_{$post['pid']}" class="rpg-post-card">

  <div class="rpg-post-pjcard" data-uid="{$post['uid']}" data-post-id="{$post['pid']}">
    <div class="rpg-post-pjcard-avatar">
      <img src="{$avatar}" alt="" onerror="this.style.display='none'">
    </div>
    
    <div class="rpg-post-pjcard-info">
      <div class="rpg-post-pj-name-row">
        <div class="rpg-post-pj-character-name">{$post['profilelink']}</div>
        <div class="rpg-post-pj-online">{$post['online_status']}</div>
      </div>
      
      <div class="rpg-post-pj-sub-row">
        <span class="rpg-post-pj-character-rank">{$post['userrole']}</span>
        <span class="rpg-post-pj-level-badge">NIVEL <strong class="rpg-pj-level-val">1</strong></span>
      </div>
      
      <div class="rpg-post-pj-vitals">
        <div class="rpg-pj-vital-row">
          <div class="rpg-pj-vital-label" data-vital="pv">
            <span><i class="fas fa-heart"></i> Vida</span>
            <span class="rpg-pj-vital-text"><span class="rpg-pj-pv-cur">0</span> / <span class="rpg-pj-pv-max">0</span></span>
          </div>
          <div class="rpg-pj-vital-bar-bg">
            <div class="rpg-pj-vital-bar-fill rpg-pj-vital-bar-fill--pv"></div>
          </div>
        </div>
        
        <div class="rpg-pj-vital-row">
          <div class="rpg-pj-vital-label" data-vital="pe">
            <span><i class="fas fa-bolt"></i> Energía</span>
            <span class="rpg-pj-vital-text"><span class="rpg-pj-pe-cur">0</span> / <span class="rpg-pj-pe-max">0</span></span>
          </div>
          <div class="rpg-pj-vital-bar-bg">
            <div class="rpg-pj-vital-bar-fill rpg-pj-vital-bar-fill--pe"></div>
          </div>
        </div>
      </div>
      
      <div class="rpg-post-pj-stats">
        <!-- Stats progress bars will be inserted here dynamically -->
      </div>
    </div>
  </div>

  <div class="rpg-post-body">
    <div class="rpg-post-head-bar">
      <span class="rpg-post-head-date">
        <i class="fas fa-clock"></i>
        {$post['postdate']} {$post['posttime']}
      </span>
      <div class="rpg-post-head-link">{$post['posturl']}</div>
    </div>

    <div class="post_body rpg-post-message-body" id="pid_{$post['pid']}">
      {$post['message']}
      
      <!-- Firma del Personaje -->
      <div class="rpg-post-pj-signature-wrapper rpg-u-hidden" id="signature_{$post['pid']}">
        <div class="rpg-post-pj-signature-divider">
          <span>FORO PRUEBA</span>
        </div>
        <div class="rpg-post-pj-signature-content"></div>
      </div>
    </div>

    <div class="rpg-post-footer-bar">
      <div class="rpg-post-find">{$post['button_find']}</div>
      <div class="rpg-post-footer-actions">
        <span class="rpg-modonly rpg-post-btn--mod is-danger">{$post['button_quickdelete']}</span>
        <span class="rpg-modonly rpg-post-btn--mod is-edit">{$post['button_edit']}</span>
        <span class="rpg-modonly rpg-post-btn--mod">{$post['button_quote']}</span>
      </div>
    </div>
  </div>
</div>
<div class="rpg-post-cards-zone" data-post-id="{$post['pid']}"></div>
