<html>
<head>
<title>{$foruminfo['name']} - Crear Nuevo Tema</title>
{$headerinclude}
</head>
<body>
{$header}

<div class="rpg-full-form-container hxh-posting-shell hxh-foro-shell">
    <div class="rpg-full-form-header">
        <h1><i class="fas fa-pen-nib"></i> Crear Nuevo Tema</h1>
        <p>en {$foruminfo['name']}</p>
    </div>
    <form action="newthread.php" method="post" enctype="multipart/form-data" id="post_form" name="input">
        <input type="hidden" name="action" value="do_newthread" />
        <input type="hidden" name="fid" value="{$fid}" />
        <input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
        <input type="hidden" name="subject" value="" />
        
        <div class="rpg-full-form-body">
            {$preview}
            <div class="rpg-form-group">
                <label class="rpg-form-label" for="subject"><i class="fas fa-heading"></i> Título del Tema</label>
                <input type="text" class="rpg-form-input" name="subject" id="subject" placeholder="Escribe un título claro y descriptivo..." />
            </div>

            <div class="rpg-thread-meta-row">
                <div class="rpg-thread-meta-row__field">
                    <label class="rpg-form-label" for="game_thread_type"><i class="fas fa-tag"></i> Tipo de Rol</label>
                    <select name="game_thread_type" id="game_thread_type" class="rpg-form-input">
                        <option value="Presente">Presente</option>
                        <option value="Pasado">Pasado</option>
                        <option value="Mision">Misión</option>
                        <option value="Evento">Evento</option>
                        <option value="Trama">Trama</option>
                        <option value="Fic">Fic</option>
                        <option value="Off_Rol">Off Rol</option>
                    </select>
                </div>
                <div class="rpg-thread-meta-row__field rpg-thread-meta-row__field--wide">
                    <label class="rpg-form-label"><i class="fas fa-calendar-alt"></i> Fecha en el Rol</label>
                    <div class="rpg-thread-meta-row__dates">
                        <div>
                            <input type="number" name="game_day" id="game_day" class="rpg-form-input" min="1" max="100" placeholder="Día">
                        </div>
                        <div>
                            <select name="game_season" id="game_season" class="rpg-form-input">
                                <option value="0">Primavera</option>
                                <option value="1">Verano</option>
                                <option value="2">Otoño</option>
                                <option value="3">Invierno</option>
                            </select>
                        </div>
                        <div>
                            <input type="number" name="game_year" id="game_year" class="rpg-form-input" min="1" placeholder="Año">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="rpg-form-group">
                <label class="rpg-form-label" for="message"><i class="fas fa-align-left"></i> Contenido</label>
                {$codebuttons}
                <textarea name="message" id="message" class="rpg-editor-textarea" rows="16" placeholder="Escribe aquí el contenido de tu tema...">{$message}</textarea>
            </div>

            {$posting_rpg_system_block}

            {$attachmentbox}
            {$postoptions}
        </div>
        
        <div class="rpg-form-footer">
            <a href="forumdisplay.php?fid={$fid}" class="rpg-btn--secondary"><i class="fas fa-times"></i> Cancelar</a>
            <button type="submit" class="rpg-btn--primary"><i class="fas fa-paper-plane"></i> Publicar Tema</button>
        </div>
    </form>
</div>

<script>
(function() {
    function getGlobalDate() {
        var epoch = new Date('2026-05-01T00:00:00Z').getTime();
        // Ajuste para evitar diferencias de Timezone, aunque mejor basarnos en time() 
        // pero en JS no lo tenemos exacto del server, calcularemos con la zona local UTC
        var now = Date.now();
        var diffSeconds = Math.max(0, (now - epoch) / 1000);
        var diffDaysFloat = diffSeconds / 86400;
        var rolDays = Math.floor(diffDaysFloat * 1.5) + 1;
        
        var daysPerSeason = 65;
        var daysPerYear = daysPerSeason * 4;
        
        return {
            year: Math.floor((rolDays - 1) / daysPerYear) + 1,
            dayOfYear: ((rolDays - 1) % daysPerYear) + 1,
            seasonIdx: Math.floor(((rolDays - 1) % daysPerYear) / daysPerSeason),
            day: (((rolDays - 1) % daysPerYear) % daysPerSeason) + 1
        };
    }
    
    // We need hidden inputs to send data when fields are disabled
    var form = document.getElementById('post_form');
    var hDay = document.createElement('input'); hDay.type = 'hidden'; hDay.name = 'game_day'; hDay.id = 'hidden_game_day';
    var hSeason = document.createElement('input'); hSeason.type = 'hidden'; hSeason.name = 'game_season'; hSeason.id = 'hidden_game_season';
    var hYear = document.createElement('input'); hYear.type = 'hidden'; hYear.name = 'game_year'; hYear.id = 'hidden_game_year';
    form.appendChild(hDay);
    form.appendChild(hSeason);
    form.appendChild(hYear);

    var iDay = document.getElementById('game_day');
    var iSeason = document.getElementById('game_season');
    var iYear = document.getElementById('game_year');
    var sel = document.getElementById('game_thread_type');

    function syncHiddenInputs() {
        if (sel.value === 'Presente') {
            hDay.value = iDay.value;
            hSeason.value = iSeason.value;
            hYear.value = iYear.value;
            
            // Disable original inputs from sending data
            iDay.name = '';
            iSeason.name = '';
            iYear.name = '';
        } else {
            // Restore original names so they send data
            iDay.name = 'game_day';
            iSeason.name = 'game_season';
            iYear.name = 'game_year';
            
            // Clear hidden
            hDay.value = '';
            hSeason.value = '';
            hYear.value = '';
        }
    }

    function fillDate(d) {
        iDay.value = d.day;
        iSeason.value = d.seasonIdx;
        iYear.value = d.year;
    }
    
    function clearDate() {
        iDay.value = '';
        iSeason.value = '0';
        iYear.value = '';
    }
    
    function setInputsDisabled(disabled) {
        iDay.disabled = disabled;
        iSeason.disabled = disabled;
        iYear.disabled = disabled;
        [iDay, iSeason, iYear].forEach(function(el) {
            if (disabled) el.classList.add('is-disabled');
            else el.classList.remove('is-disabled');
        });
    }

    function onTypeChange() {
        if (sel.value === 'Presente') {
            fillDate(getGlobalDate());
            setInputsDisabled(true);
        } else {
            clearDate();
            setInputsDisabled(false);
        }
        syncHiddenInputs();
        var navBtn = document.getElementById('rpg-tab-btn-navegacion');
        if (navBtn) {
            if (sel.value === 'Presente') {
                navBtn.classList.remove('is-disabled');
                navBtn.title = '';
                navBtn.onclick = null;
            } else {
                navBtn.classList.add('is-disabled');
                navBtn.title = 'Navegación solo disponible en hilos de tipo Presente.';
                navBtn.onclick = function(e) { e.preventDefault(); };
            }
        }
    }
    
    sel.addEventListener('change', onTypeChange);
    
    // Also sync on manual input changes when not Presente
    iDay.addEventListener('input', syncHiddenInputs);
    iSeason.addEventListener('change', syncHiddenInputs);
    iYear.addEventListener('input', syncHiddenInputs);
    
    onTypeChange();
})();
</script>

{$footer}
</body>
</html>
