<div class="nav-avatar nav-guest-avatar"><i class="fas fa-user-secret"></i></div>
<div class="nav-welcome-text">
    <a href="{$mybb->settings['bburl']}/member.php?action=login" id="quick-login-open" class="nav-guest-login-link">Entrar</a>
</div>

<!-- Modal Login -->
<div class="modal quick-login-modal" id="quick_login">
    <form method="post" action="{$mybb->settings['bburl']}/member.php">
        <input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
        <input name="action" type="hidden" value="do_login" />
        <input name="url" type="hidden" value="" />
        <input name="quick_login" type="hidden" value="1" />
        
        <h3 class="quick-login-modal__title">Iniciar Sesión</h3>
        
        <div class="quick-login-modal__group">
            <label class="quick-login-modal__label">Usuario</label>
            <input name="quick_username" type="text" class="hero-search-input quick-login-modal__input" />
        </div>
        
        <div class="quick-login-modal__group">
            <label class="quick-login-modal__label">Contraseña</label>
            <input name="quick_password" type="password" class="hero-search-input quick-login-modal__input" />
        </div>
        
        <div class="quick-login-modal__footer">
            <label class="quick-login-modal__remember"><input name="quick_remember" type="checkbox" value="yes" checked /> Recordarme</label>
            <input name="submit" type="submit" class="hero-search-btn quick-login-modal__submit" value="Entrar" />
        </div>
    </form>
</div>
<script type="text/javascript">
(function () {
    var open = document.getElementById('quick-login-open');
    if (open) {
        open.addEventListener('click', function (e) {
            e.preventDefault();
            if (window.jQuery && jQuery.fn.modal) {
                jQuery('#quick_login').modal({ fadeDuration: 250, keepelement: true, zIndex: 9999 });
            }
        });
    }
    if (window.jQuery) {
        jQuery("#quick_login input[name='url']").val(jQuery(location).attr('href'));
    }
})();
</script>
