<div class="nav-avatar" style="background: var(--bg-main); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text-muted);"><i class="fas fa-user-secret"></i></div>
<div class="nav-welcome-text">
    <a href="{$mybb->settings['bburl']}/member.php?action=login" id="quick-login-open" style="color: var(--text-primary);">Entrar</a>
</div>

<!-- Modal Login -->
<div class="modal" id="quick_login" style="display: none; background: var(--bg-surface); color: var(--text-primary); border-radius: var(--radius-lg); padding: 20px;">
    <form method="post" action="{$mybb->settings['bburl']}/member.php">
        <input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
        <input name="action" type="hidden" value="do_login" />
        <input name="url" type="hidden" value="" />
        <input name="quick_login" type="hidden" value="1" />
        
        <h3 style="font-family: var(--font-heading); margin-bottom: 20px;">Iniciar Sesión</h3>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">Usuario</label>
            <input name="quick_username" type="text" class="hero-search-input" style="padding: 10px; width: 100%;" />
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: var(--text-secondary);">Contraseña</label>
            <input name="quick_password" type="password" class="hero-search-input" style="padding: 10px; width: 100%;" />
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <label style="color: var(--text-secondary); font-size: 12px;"><input name="quick_remember" type="checkbox" value="yes" checked /> Recordarme</label>
            <input name="submit" type="submit" class="hero-search-btn" style="position: static; padding: 0 20px; width: auto; border-radius: 20px;" value="Entrar" />
        </div>
    </form>
</div>
<script type="text/javascript">
(function () {
    var open = document.getElementById('quick-login-open');
    if (open) {
        open.addEventListener('click', function (e) {
            e.preventDefault();
            if (window.jQuery && jQuery.fn.modal) {
                jQuery('#quick_login').modal({ fadeDuration: 250, keepelement: true, zIndex: 9999 });
            }
        });
    }
    if (window.jQuery) {
        jQuery("#quick_login input[name='url']").val(jQuery(location).attr('href'));
    }
})();
</script>
