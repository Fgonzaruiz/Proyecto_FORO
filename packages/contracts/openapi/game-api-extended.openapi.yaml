openapi: 3.0.3
info:
  title: Game API — extended endpoints
  version: 0.2.0
servers:
  - url: https://example.local
paths:
  /game/ajax/busquedas_list.php:
    get:
      summary: List approved roleplay searches (public tablón)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/busquedas_pending.php:
    get:
      summary: List pending searches (staff level >= 2)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/busquedas_submit.php:
    post:
      summary: Submit a new search (login + CSRF)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/busquedas_action.php:
    post:
      summary: Approve or deny a search (staff)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/busquedas_contact.php:
    post:
      summary: Contact search owner via notification
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/busquedas_resolve_contact.php:
    post:
      summary: Accept or reject search contact request
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/announcements_list.php:
    get:
      summary: Staff announcements for index tablón
      responses:
        '200':
          description: OK
  /game/ajax/announcements_save.php:
    post:
      summary: Create/edit/delete announcement (staff level 3)
      responses:
        '200':
          description: OK
  /game/ajax/claim_character_level.php:
    post:
      summary: Claim level-up rewards for character
      responses:
        '200':
          description: OK
  /game/ajax/purchase_attribute.php:
    post:
      summary: Purchase attribute point for approved character
      responses:
        '200':
          description: OK
  /game/ajax/latest_activity.php:
    get:
      summary: Latest forum activity widget data
      responses:
        '200':
          description: OK
  /game/ajax/thread_pj_state.php:
    get:
      summary: PV/PE state for active character in thread
      parameters:
        - name: thread_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /game/ajax/cards_for_post.php:
    get:
      summary: Cards played on a post (public)
      parameters:
        - name: post_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /game/ajax/cards_delete.php:
    post:
      summary: Delete card from catalog (staff)
      responses:
        '200':
          description: OK
  /game/ajax/cards_pending_requests.php:
    get:
      summary: Pending card requests (staff)
      responses:
        '200':
          description: OK
  /game/ajax/cards_request_list_mine.php:
    get:
      summary: Card requests for a character
      responses:
        '200':
          description: OK
  /game/ajax/cards_request_action.php:
    post:
      summary: Request card rank change
      responses:
        '200':
          description: OK
  /game/ajax/cards_request_custom.php:
    post:
      summary: Request custom card
      responses:
        '200':
          description: OK
  /game/ajax/cards_request_conforme.php:
    post:
      summary: Owner conforms to staff card proposal
      responses:
        '200':
          description: OK
  /game/ajax/cards_request_reply.php:
    post:
      summary: Reply on card request thread
      responses:
        '200':
          description: OK
  /game/ajax/cards_resolve_request.php:
    post:
      summary: Staff resolves card request
      responses:
        '200':
          description: OK
  /game/ajax/cards_search_characters.php:
    get:
      summary: Search characters for card assign (staff)
      responses:
        '200':
          description: OK
  /game/ajax/akuma_catalog.php:
    get:
      summary: Akuma no Mi catalog for petitions (login)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/akuma_roll.php:
    post:
      summary: Random Akuma roll + create admin request (login + CSRF)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/admin_requests_submit.php:
    post:
      summary: Submit administrative request (login + CSRF)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/admin_requests_pending.php:
    get:
      summary: List pending admin requests (staff level >= 2)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/admin_requests_action.php:
    post:
      summary: Approve or deny admin request (staff + CSRF)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/reveal_hidden_action.php:
    post:
      summary: Reveal a hidden action in a post (author + CSRF)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/save_avatar_sig.php:
    post:
      summary: Save active character avatar and signature (login + CSRF)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/inventory_toggle.php:
    post:
      summary: Equip or unequip a card (login + ownership)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/staff_account_action.php:
    post:
      summary: Perform account action (staff)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/staff_account_lookup.php:
    get:
      summary: Lookup account information (staff)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/zona_staff_historia_save.php:
    post:
      summary: Save timeline history eras and events (staff)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
  /game/ajax/post_template.php:
    get:
      summary: Get post templates for a character (login)
      parameters:
        - name: character_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK returns {ok, data: {templates: [{name, content}]}}
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
    post:
      summary: Save post templates for a character (login + CSRF)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                character_id:
                  type: integer
                templates:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      content:
                        type: string
                my_post_key:
                  type: string
              required:
                - character_id
                - templates
                - my_post_key
      responses:
        '200':
          description: OK
  /game/ajax/preview_post.php:
    post:
      summary: Render BBCode preview for editor content (login optional)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
                - content
      responses:
        '200':
          description: OK returns {ok, data: {html}}
          content:
            application/json:
              schema:
                $ref: 'game-api.openapi.yaml#/components/schemas/StdOk'
              examples:
                preview:
                  value:
                    ok: true
                    data:
                      html: "<p>BBCode renderizado</p>"
                    error: null
  /game/ajax/save_forum_island.php:
    post:
      summary: Staff save forum island metadata (staff level 3+)
      responses:
        '200':
          description: OK
  /game/ajax/shop_catalog_list.php:
    get:
      summary: List shop catalog cards for staff (scope active|pool)
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [active, pool]
      responses:
        '200':
          description: OK
  /game/ajax/shop_catalog_update.php:
    post:
      summary: Staff update shop card catalog entry
      responses:
        '200':
          description: OK
  /game/ajax/tienda_card_detail.php:
    get:
      summary: Card detail for tienda modal
      parameters:
        - name: card_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /game/ajax/oficios_list.php:
    get:
      summary: List oficios catalog
      responses:
        '200':
          description: OK
  /game/ajax/oficios_save.php:
    post:
      summary: Staff save oficio catalog entry
      responses:
        '200':
          description: OK
  /game/ajax/character_oficios_get.php:
    get:
      summary: List oficios for a character
      parameters:
        - name: character_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /game/ajax/character_oficios_save.php:
    post:
      summary: Staff assign oficio rank to character
      responses:
        '200':
          description: OK
  /game/ajax/disciplinas_list.php:
    get:
      summary: List disciplinas catalog
      responses:
        '200':
          description: OK
  /game/ajax/disciplinas_save.php:
    post:
      summary: Staff save disciplina catalog entry
      responses:
        '200':
          description: OK
  /game/ajax/character_disciplinas_get.php:
    get:
      summary: List disciplinas for a character
      parameters:
        - name: character_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /game/ajax/character_disciplinas_save.php:
    post:
      summary: Staff assign disciplina grade to character
      responses:
        '200':
          description: OK
  /game/ajax/navigation_islands_list.php:
    get:
      summary: List destination islands for navigation
      parameters:
        - name: exclude
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /game/ajax/navigation_ships.php:
    get:
      summary: Equipped barco cards for character
      parameters:
        - name: character_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /game/ajax/navigation_preview.php:
    get:
      summary: Preview voyage calculation
      responses:
        '200':
          description: OK
  /game/ajax/navigation_context.php:
    get:
      summary: Navigation tab context (island, ship, navegante)
      parameters:
        - name: fid
          in: query
          schema: { type: integer }
        - name: character_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /game/ajax/navigation_routes_list.php:
    get:
      summary: Staff list navigation routes
      responses:
        '200':
          description: OK
  /game/ajax/navigation_routes_save.php:
    post:
      summary: Staff save or delete navigation route
      responses:
        '200':
          description: OK
  /game/ajax/navigation_voyage_review.php:
    post:
      summary: Staff approve or deny a navigation voyage (auto-reply in thread)
      responses:
        '200':
          description: OK
  /game/ajax/navigation_voyages_list.php:
    get:
      summary: Staff list voyages
      responses:
        '200':
          description: OK
  /game/ajax/navigation_voyage_status.php:
    post:
      summary: Staff update voyage status
      responses:
        '200':
          description: OK

