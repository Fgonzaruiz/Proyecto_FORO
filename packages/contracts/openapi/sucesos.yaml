openapi: 3.1.0
info:
  title: API de Sucesos
  version: 1.0.0
paths:
  /game/ajax/sucesos.php:
    post:
      summary: Enviar un nuevo suceso
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [submit_suceso]
                url:
                  type: string
                title:
                  type: string
                desc:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
