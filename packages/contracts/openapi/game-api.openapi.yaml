openapi: 3.0.3
info:
  title: Game API (MyBB module + mechanics backend)
  version: 0.1.0
servers:
  - url: https://example.local
paths:
  /game/ajax/ping.php:
    get:
      summary: Ping (MyBB session available)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/character_get.php:
    get:
      deprecated: true
      summary: Get character (NOT IMPLEMENTED — use save_personaje / personaje.php; D001 local DB)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/inventory_get.php:
    get:
      deprecated: true
      summary: Get inventory (NOT IMPLEMENTED — use game/public/inventory.php; D001 local DB)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/economy_get.php:
    get:
      deprecated: true
      summary: Get economy (NOT IMPLEMENTED — use game/public/economy.php; D001 local DB)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/roll_execute.php:
    post:
      deprecated: true
      summary: Execute roll (NOT IMPLEMENTED — use cards_play / rolls.php; D001 local DB)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/staff_award_xp.php:
    post:
      deprecated: true
      summary: Award XP (NOT IMPLEMENTED — staff tools local; D001 local DB)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '501':
          description: Not implemented (skeleton)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/get_thread_diary_data.php:
    get:
      summary: Obtener datos de un hilo para el diario (tipo, fecha, participantes)
      parameters:
        - name: thread_id
          in: query
          schema:
            type: integer
          description: ID del hilo en MyBB
        - name: url
          in: query
          schema:
            type: string
          description: URL completa del hilo (alternativa a thread_id)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StdOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          thread_id: { type: integer }
                          thread_name: { type: string }
                          thread_uid: { type: integer }
                          category: { type: string, enum: [Pasado, Presente, Mision, Evento, Trama, Fic, Off_Rol] }
                          day: { type: integer }
                          season: { type: integer }
                          year: { type: integer }
                          participants:
                            type: array
                            items:
                              type: object
                              properties:
                                pj_id: { type: integer }
                                name: { type: string }
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
        '404':
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/my_personajes.php:
    get:
      summary: List characters for current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/save_personaje.php:
    post:
      summary: Save/create a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pj_id: { type: integer }
                name: { type: string }
                race_name: { type: string }
                occupation_name: { type: string }
                rango: { type: string }
                avatar: { type: string }
                data_json: { type: object }
                stats_json: { type: object }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/set_active_pj.php:
    post:
      summary: Set active character for user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pj_id]
              properties:
                pj_id: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/get_active_pj_for_user.php:
    get:
      summary: Get active character for a user, optionally by post/thread
      parameters:
        - name: uid
          in: query
          schema: { type: integer }
        - name: post_id
          in: query
          schema: { type: integer }
        - name: thread_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/aprobar_personaje.php:
    post:
      summary: Approve/reject a character (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pj_id: { type: integer }
                action: { type: string, enum: [approve, reject] }
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/personajes_pendientes_list.php:
    get:
      summary: List pending characters for staff review
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/get_calendar.php:
    get:
      summary: Get game calendar data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/get_personaje_preview.php:
    get:
      summary: Get character preview data
      parameters:
        - name: pj_id
          in: query
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/notifications_delete.php:
    post:
      summary: Delete a notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/update_cronologia.php:
    post:
      summary: Guardar/eliminar entrada del diario, relación, grupo o conexión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pj_id: { type: integer }
                type: { type: string, enum: [diario, relacion, group, connection, network_batch] }
                action: { type: string, enum: [save, delete] }
                entry_id: { type: string }
                thread_id: { type: integer }
                link: { type: string }
                desc: { type: string }
                day: { type: integer }
                season: { type: integer }
                year: { type: integer }
                category: { type: string, enum: [Pasado, Presente, Mision, Evento, Trama, Fic, Off_Rol] }
              required: [pj_id, type]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdFail'
  /game/ajax/cards_list.php:
    get:
      summary: List all cards
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/cards_my_deck.php:
    get:
      summary: List cards for current character
      parameters:
        - name: character_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/cards_create.php:
    post:
      summary: Create new card definition (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                card_type: { type: string }
                rank: { type: string }
                activation: { type: string }
                tags: { type: array, items: { type: string } }
                description: { type: string }
                cost_pe: { type: string }
                execution_stat: { type: string }
                dice: { type: string }
                execution_cost: { type: integer }
                effects: { type: object }
                upgrade: { type: object }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/cards_update.php:
    post:
      summary: Update existing card definition (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_id, name]
              properties:
                card_id: { type: integer }
                name: { type: string }
                execution_cost: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/cards_assign.php:
    post:
      summary: Assign card to character (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [character_id, card_id]
              properties:
                character_id: { type: integer }
                card_id: { type: integer }
                rank: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/cards_unassign.php:
    post:
      summary: Remove card assignment from character (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [character_id, card_id]
              properties:
                character_id: { type: integer }
                card_id: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'
  /game/ajax/cards_play.php:
    post:
      summary: Play cards on a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id, card_ids]
              properties:
                post_id: { type: integer }
                card_ids: { type: array, items: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdOk'

components:
  schemas:
    StdOk:
      type: object
      required: [ok, data, error, meta]
      properties:
        ok: { type: boolean, enum: [true] }
        data: { type: object, additionalProperties: true }
        error: { type: 'null' }
        meta: { type: object, additionalProperties: true }
    StdFail:
      type: object
      required: [ok, data, error, meta]
      properties:
        ok: { type: boolean, enum: [false] }
        data: { type: 'null' }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        meta: { type: object, additionalProperties: true }

